<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SpotON Locator – ResNet-50 Object Detection & Live Maps</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet Map Engine (Zero API-Key Required, Fallback & Production Ready) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    #map { height: 100%; width: 100%; min-height: 400px; z-index: 10; }
    .badge-icon {
      border-radius: 50%;
      color: white;
      font-weight: bold;
      text-align: center;
      line-height: 32px;
      font-size: 13px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      border: 2px solid white;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen select-none">

  <!-- Header Bar -->
  <header class="bg-slate-900 border-b border-slate-800 px-6 py-3 flex items-center justify-between shadow-md">
    <div class="flex items-center gap-3">
      <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
      <h1 class="text-lg font-bold tracking-wide">SpotON Locator</h1>
      <span class="text-xs bg-indigo-900/80 text-indigo-300 border border-indigo-700 px-2.5 py-0.5 rounded-full font-mono">
        ResNet-50 Bounding Box Occupancy
      </span>
    </div>
    <div class="text-xs text-slate-400 font-mono">Live Bengaluru Grid</div>
  </header>

  <!-- Main View -->
  <div class="flex flex-1 overflow-hidden">
    <!-- Map Canvas -->
    <div class="flex-1 relative">
      <div id="map"></div>
    </div>

    <!-- Parking Zone Inspector Sidebar -->
    <div class="w-96 bg-slate-900 border-l border-slate-800 p-5 flex flex-col gap-4 overflow-y-auto">
      <div>
        <h2 id="zone-title" class="text-lg font-semibold text-white">Select a Parking Lot</h2>
        <p id="zone-meta" class="text-xs text-slate-400">Click any locator marker on the map to inspect real-time slots.</p>
      </div>

      <!-- Quick Metrics -->
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-slate-800/80 p-3 rounded-lg border border-slate-700">
          <div class="text-xs text-slate-400">Available Slots</div>
          <div id="vacant-count" class="text-2xl font-bold text-emerald-400">--</div>
        </div>
        <div class="bg-slate-800/80 p-3 rounded-lg border border-slate-700">
          <div class="text-xs text-slate-400">Occupancy</div>
          <div id="occupancy-rate" class="text-2xl font-bold text-amber-400">--</div>
        </div>
      </div>

      <!-- Live Camera Stream -->
      <div id="camera-section" class="flex flex-col gap-2">
        <div class="flex justify-between items-center text-xs font-medium text-slate-300">
          <span>LIVE RESNET-50 DETECTION</span>
          <span id="model-accuracy" class="text-emerald-400 font-mono"></span>
        </div>
        <div class="relative rounded-lg overflow-hidden border border-slate-700 bg-black">
          <img id="annotated-stream" src="/api/annotated.jpg" alt="Parking Stream" class="w-full object-cover">
        </div>
        <form id="upload-form" class="mt-1 flex flex-col gap-2">
          <label class="text-xs text-slate-400">Test image or Kaggle frame:</label>
          <input type="file" id="image-input" accept="image/*" class="text-xs text-slate-400 file:bg-slate-800 file:text-slate-200 file:border-0 file:py-1 file:px-2 file:rounded hover:file:bg-slate-700 cursor-pointer">
          <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 py-1.5 px-3 rounded text-xs font-semibold text-white transition">Run Inference</button>
        </form>
      </div>

      <!-- Individual Slot Statuses -->
      <div class="flex flex-col gap-2 mt-2">
        <div class="text-xs font-semibold text-slate-400">PARKING SLOT MATRIX</div>
        <div id="slot-grid" class="grid grid-cols-4 gap-2"></div>
      </div>
    </div>
  </div>

  <script>
    let map, markers = [], zonesData = [];

    function initMap() {
      // Initialize interactive map centered on Bengaluru coordinates
      map = L.map('map').setView([12.9756, 77.6066], 12);

      // CartoDB Dark Matter tiles (matching Google Dark Map styling without requiring billing keys)
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
        subdomains: 'abcd',
        maxZoom: 19
      }).addTo(map);

      fetchZones();
    }

    async function fetchZones() {
      try {
        const res = await fetch('/api/zones');
        zonesData = await res.json();
        renderMarkers();
        if (zonesData.length > 0) selectZone(zonesData[0]);
      } catch (err) {
        console.error("Failed to load parking zones:", err);
      }
    }

    function renderMarkers() {
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      zonesData.forEach(zone => {
        const color = zone.vacant_slots > 0 ? '#10b981' : '#ef4444';
        const customIcon = L.divIcon({
          className: 'custom-pin',
          html: `<div class="badge-icon" style="background-color: ${color}; width: 34px; height: 34px;">${zone.vacant_slots}</div>`,
          iconSize: [34, 34],
          iconAnchor: [17, 17]
        });

        const marker = L.marker([zone.lat, zone.lng], { icon: customIcon }).addTo(map);
        marker.bindTooltip(`<b>${zone.name}</b><br>Vacant: ${zone.vacant_slots}/${zone.total_slots}`, { direction: 'top' });
        marker.on('click', () => {
          selectZone(zone);
          map.panTo([zone.lat, zone.lng]);
        });
        markers.push(marker);
      });
    }

    function selectZone(zone) {
      document.getElementById("zone-title").textContent = zone.name;
      document.getElementById("zone-meta").textContent = `${zone.area} • ${zone.zone_type.toUpperCase()}`;
      document.getElementById("vacant-count").textContent = `${zone.vacant_slots} / ${zone.total_slots}`;
      const occPercent = Math.round((zone.occupied_slots / zone.total_slots) * 100) || 0;
      document.getElementById("occupancy-rate").textContent = `${occPercent}%`;

      const camSection = document.getElementById("camera-section");
      if (zone.live) {
        camSection.classList.remove("hidden");
        document.getElementById("model-accuracy").textContent = `Accuracy: ${zone.accuracy}%`;
        document.getElementById("annotated-stream").src = `/api/annotated.jpg?t=${Date.now()}`;
      } else {
        camSection.classList.add("hidden");
      }

      const grid = document.getElementById("slot-grid");
      grid.innerHTML = "";
      zone.slots.forEach(s => {
        const d = document.createElement("div");
        d.className = `p-2 rounded text-center text-xs font-mono border ${
          s.status === 'vacant'
            ? 'bg-emerald-950/40 border-emerald-500/50 text-emerald-400'
            : 'bg-rose-950/40 border-rose-500/50 text-rose-400'
        }`;
        d.textContent = s.slot_label;
        grid.appendChild(d);
      });
    }

    document.getElementById("upload-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById("image-input");
      if (!fileInput.files[0]) return alert("Select an image first");

      const fd = new FormData();
      fd.append("image", fileInput.files[0]);

      const res = await fetch("/api/detect", { method: "POST", body: fd });
      const data = await res.json();
      if (data.ok) {
        fetchZones();
      } else {
        alert("Detection error: " + data.error);
      }
    });

    window.onload = initMap;
  </script>
</body>
</html>
